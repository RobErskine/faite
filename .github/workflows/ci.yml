name: CI

# This repo is private on a Free plan, so every runner-minute below is
# metered against a 2,000/month allowance. The `paths-ignore` is not
# housekeeping — a documentation-only commit ("docs: Wave 4 runbook",
# 2026-08-18) is what triggered the six-hour `apt` hang that burned 360
# billed minutes, 18% of a month, for a change that could not have broken a
# test. Prose does not need a browser.
#
# `paths-ignore` skips a run only when *every* changed path matches, so a
# commit touching both code and docs still runs in full. Nothing here is a
# required status check (branch protection needs Pro), so a skipped run
# cannot leave a PR stuck waiting on a check that will never arrive.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", ".ai/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", ".ai/**", "LICENSE"]
  # An escape hatch for the above: if a docs-only change ever does need a
  # run, or a flake needs re-confirming, start one by hand rather than
  # pushing an empty commit to trick the triggers. It is also the only place
  # the full 5-project e2e matrix runs in CI — see the `e2e` job.
  workflow_dispatch:
    inputs:
      e2e:
        description: "e2e scope — the full 5-project matrix, or just the PR gate"
        type: choice
        options: [full, gate]
        default: full

# Superseded runs are dead work. Pushing three times to a PR used to leave
# three full CI runs racing each other for runners, and only the last one's
# result was ever looked at. Cancel the older ones (EI-187).
#
# `main` is deliberately exempt via the `github.ref` half of the key: every
# push to main gets its own concurrency group, so a merge is never cancelled
# by the merge behind it and each commit on main keeps an independent result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # A stalled job otherwise runs to GitHub's 6-hour default. This job's
    # p100 is ~4 min; 15 leaves generous headroom and still fails the same
    # morning rather than the same afternoon.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Next's own compiler cache. This job runs `next build` twice (Workers
      # target, then the static export) on a fresh checkout, so without this
      # both start from zero every run. `verify` now runs on every PR *and*
      # every merge, and is the co-critical path opposite `e2e`, so ~30s here
      # is ~30s off the whole workflow twice per merge.
      #
      # Keyed on the lockfile plus the source tree: a dependency bump or a
      # source change gets a fresh entry, and `restore-keys` still seeds it
      # from the last good cache rather than starting cold. Only `.next/cache`
      # — never `.next` itself, which holds the build output and would make a
      # stale artifact look like a fresh one.
      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Typecheck (app + worker)
        run: npm run typecheck

      # Ahead of the builds regardless of lint ordering: vitest takes seconds
      # where the two Next builds take minutes, so a logic regression
      # shouldn't queue behind them.
      - name: Tests
        run: npm test

      # `npm run lint` had a pre-existing failure at `use-day-track.ts:156`
      # that used to halt the job here, so this and everything below it never
      # actually ran in CI — see docs/SYNC.md "Verification bar". Fixed
      # 2026-08-09; lint is clean now, so a failure here is a real one.
      - name: Lint
        run: npm run lint

      - name: Build (Workers target)
        run: npm run build

      # Capacitor guard. The mobile app (P7) is a static bundle in a WebView with
      # no server, so this build must stay green every phase. If it breaks, an app
      # route has taken a dependency on RSC data fetching, middleware, or
      # next/image optimization — fix it now, not at P7.
      - name: Build (static export target for Capacitor)
        run: npm run build:static

  e2e:
    # Static, deliberately (EI-189). A computed name is only evaluated for
    # jobs that actually *run* — a job skipped by its `if:` reports the raw
    # `${{ ... }}` template to the checks API instead. Since this job is
    # skipped on every push to `main`, a computed name meant every merge
    # showed a checks entry that looked like a broken workflow. The E2E step
    # below still says which scope it ran.
    name: e2e
    runs-on: ubuntu-latest

    # Not on a merge into `main`. A `pull_request` run tests the *merge
    # result* (`refs/pull/N/merge`), not the branch tip — so by the time a PR
    # is merged, this exact tree has already had the full suite run against
    # it minutes earlier, and re-running it on `main` bought a second copy of
    # the same answer for ~14 more billed minutes every single merge. Across
    # the last 40 runs, `push` cost 610 billed minutes against
    # `pull_request`'s 350; that gap is almost entirely this duplicate.
    #
    # `verify` still runs on `main` and is the deliberate exception: it is
    # ~5 min, and it is the one that catches a *semantic* conflict, where two
    # PRs each pass alone and break together (typecheck, unit tests, both
    # builds). That failure mode is real and only observable after the merge.
    # An e2e regression that verify misses but the merged PR's own e2e run
    # did not is a much narrower case, and not worth 14 minutes a merge.
    #
    # `workflow_dispatch` still runs it, so a full pre-release check on
    # `main` is one button away when you want one.
    if: github.event_name != 'push'
    # Parallel to `verify`, not appended to it: `verify` already runs two
    # Next builds and takes minutes; browser launch + a live dev server adds
    # real time, and this suite doesn't depend on `verify`'s outcome, so
    # there's no reason to serialize them. See docs/E2E.md.
    #
    # ~2x each path's own p100, so a stall is caught in one coffee rather
    # than one afternoon.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 20 || 10 }}

    # NOT sharded any more, and the reasoning is worth keeping because it
    # reverses EI-187's.
    #
    # Sharding's only product is wall clock on the blocking path, and it buys
    # that by paying the fixed setup — container pull + `npm ci` + `next dev`
    # boot, ~140s — once per shard. EI-187 took the three-shard job to ~4m30,
    # but `verify` runs alongside at ~4m30 regardless, so the PR was never
    # going to finish sooner than that. The shards bought nothing on the
    # critical path and cost ~10 billed runner-minutes per PR run.
    #
    # That was the wrong currency to optimise. This repo is private on a Free
    # plan: 2,000 minutes a month, and landing EI-187 itself burned ~125 of
    # them across eight pushes. Iteration count is the multiplier, so what
    # matters is the cost of *one* run, not its wall clock.
    #
    # Unsharded, the gate is ~6m and 7 billed minutes against the old 15 —
    # and the full matrix on `workflow_dispatch` gets cheaper too (9 vs 15),
    # just slower, which is the right trade for a button nobody waits on.

    # Runs in Playwright's own image rather than on bare `ubuntu-latest`
    # (EI-187). This is the fix for the intermittent hang, not a speed-up:
    # the old job cached the browser binaries but still shelled out to `apt`
    # on every single run to install their OS dependencies, and twice during
    # the Aug 17–18 merge queue that `apt` call stalled with no output — 22
    # min on `ei-183`, 35 min on `ei-62`, both green on re-run. The image
    # ships Chromium *and* its OS deps preinstalled, so there is no `apt`
    # step left to stall, no browser download, and no cache to maintain.
    #
    # The tag must track the `@playwright/test` version in package-lock.json
    # or the baked-in browsers won't be the ones this Playwright expects.
    # The "Playwright version" step below fails fast, with an actionable
    # message, if the two ever drift.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # Playwright's documented option for this image: run as a non-root UID
      # so files created in the workspace stay owned by the runner user.
      options: --user 1001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Playwright version matches the container
        env:
          # Keep in step with `container.image` above. It can't be read from
          # there — GitHub doesn't expose the `env` context to `container`.
          CONTAINER_PLAYWRIGHT_VERSION: 1.62.1
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "$CONTAINER_PLAYWRIGHT_VERSION" ]; then
            echo "::error file=.github/workflows/ci.yml::package-lock.json pins @playwright/test $installed, but this job runs in mcr.microsoft.com/playwright:v$CONTAINER_PLAYWRIGHT_VERSION-noble. Bump the container image tag (and CONTAINER_PLAYWRIGHT_VERSION next to it) to v$installed-noble."
            exit 1
          fi

      # Same cache as `verify`, same reasoning — and now this job builds too,
      # so it benefits identically.
      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      # The suite runs against a real production build, not `next dev`.
      # Measured over the 53-test gate, same code, same machine:
      #
      #     next dev     487s CPU   median 8.1s/test   5 of 53 failed
      #     next start   225s CPU   median 3.6s/test   0 of 53 failed
      #
      # This build costs ~35s and buys back ~2x the test time, so it is a net
      # win on its own. The reliability difference is the bigger prize: every
      # dev-mode failure was the fixture timing out on the board's boot while
      # workers hit an on-demand-compiling server at once. It also means CI
      # exercises the bundle that actually ships. docs/E2E.md §9.
      - name: Build (production, served to the e2e suite)
        run: npm run build

      - name: E2E
        env:
          # Overrides `webServer.command` in playwright.config.ts. The port
          # matches its default, so `baseURL` needs no override.
          E2E_SERVER: npx next start -p 3000
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 15 || 8 }}
        # The mandatory/optional split, and the only place it is expressed.
        #
        # `e2e:ci` is the gate: `--project=desktop --project=phone-iphone`.
        # That pair is not arbitrary — `resolveLayout()` in
        # src/lib/use-viewport.ts is `<640` phone / `<1024` tablet, so iPad
        # Mini (768) and landscape iPhone (852) both render `DesktopBoard`,
        # and only a sub-640 project ever renders `PhoneBoard`. desktop +
        # phone-iphone is therefore the cheapest pair that exercises both
        # shells; a desktop-only gate would give phone-board.tsx zero
        # PR-time execution. See docs/E2E.md §8.5.
        #
        # The project list lives in package.json, not here, so
        # `npm run e2e:ci` locally is the same run a PR gets — and so that
        # widening the gate is a one-line change in one file.
        #
        # Note this selects *projects at invocation*; it never edits
        # `testMatch` in playwright.config.ts. That is what keeps
        # e2e/config-coverage.test.ts honest, and keeps "doesn't run on a
        # PR" and "doesn't run at all" different things.
        run: npm run ${{ (github.event_name == 'workflow_dispatch' && inputs.e2e != 'gate') && 'e2e' || 'e2e:ci' }}

      # One job, so there are no per-shard blobs left to stitch together —
      # Playwright writes the browsable report directly and this uploads it.
      # Only on failure: a green report is 14 days of metered artifact
      # storage nobody opens.
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
