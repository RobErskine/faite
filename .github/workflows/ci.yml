name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck (app + worker)
        run: npm run typecheck

      # BEFORE lint, which is where `npm run verify` puts it second — and the
      # divergence is the point. `npm run lint` has a documented pre-existing
      # failure (`use-day-track.ts:156`, called out in SCHEMA-OPS.md and SYNC.md as
      # the known baseline), and a failed step halts the job by default. Ordered
      # after lint, this suite would never have run in CI at all.
      #
      # It also belongs ahead of the builds regardless: vitest takes seconds where
      # the two Next builds take minutes, so a logic regression should not queue
      # behind them.
      - name: Tests
        run: npm test

      # Everything below is currently unreachable in CI for the same reason — the
      # lint baseline halts the job here. Worth resolving: it means the Capacitor
      # guard at the bottom has not actually run in a while.
      - name: Lint
        run: npm run lint

      - name: Build (Workers target)
        run: npm run build

      # Capacitor guard. The mobile app (P7) is a static bundle in a WebView with
      # no server, so this build must stay green every phase. If it breaks, an app
      # route has taken a dependency on RSC data fetching, middleware, or
      # next/image optimization — fix it now, not at P7.
      - name: Build (static export target for Capacitor)
        run: npm run build:static
