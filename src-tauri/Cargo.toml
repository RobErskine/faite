[package]
name = "app"
version = "0.1.0"
description = "Faite — a calendar-and-lists to-do board"
authors = ["Rob Erskine"]
license = "UNLICENSED"
repository = "https://github.com/RobErskine/faite"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# D2a: custom URL scheme for the system-browser login callback
# (`faite://auth-callback`) — see docs/DESKTOP.md §9.
tauri-plugin-deep-link = "2"
# D2a: opens the system browser for login (`bridge.ts`'s `startDesktopLogin`).
tauri-plugin-opener = "2"
# D2b: the background-sync tick timer (`background_sync.rs`). Tauri's own
# `tauri::async_runtime::spawn` schedules onto this exact runtime already
# (Tauri depends on tokio internally) — adding it directly only exposes
# `tokio::time::interval`, which `async_runtime` does not re-export.
tokio = { version = "1", features = ["time"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2"
# D2a: OS keychain storage for the bearer token (decision #3, docs/DESKTOP.md
# §2) — never `localStorage`. Default features (`v1`) already pull in the
# macOS Keychain backend (`apple-native-keyring-store`); no extra feature
# flags needed for this platform.
keyring = "4"
